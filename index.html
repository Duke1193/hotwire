<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Getaway" />
    <title>GETAWAY — steal a car. lose the cops. bring a friend.</title>
    <meta
      name="description"
      content="A small top-down arcade city. Steal a car, lose the cops, and send one link to play in the same city as a friend. Free, no account, runs in the browser."
    />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GETAWAY" />
    <meta property="og:title" content="GETAWAY" />
    <meta property="og:description" content="steal a car. lose the cops. bring a friend." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A top-down city street with a red car and a patrol car under the word GETAWAY." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GETAWAY" />
    <meta name="twitter:description" content="steal a car. lose the cops. bring a friend." />
    <meta name="twitter:image" content="/og.png" />

    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d12;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        position: fixed;
        inset: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /*
       * --gw-vw / --gw-vh are written from visualViewport on every reflow, so
       * the canvas and the DOM overlay always occupy exactly the area Safari
       * is actually showing. dvh is the fallback before the first measurement.
       */
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--gw-vw, 100vw);
        height: var(--gw-vh, 100dvh);
        touch-action: none;
      }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
